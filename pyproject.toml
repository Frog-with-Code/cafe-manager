[project]
name = "cafe-manager"
version = "0.1.0"
description = "CLI tool for comprehensive cafe management with isolation per venue"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Artem Shumilov", email = "frogwithcode@gmail.com" }]
dependencies = [
    "fastapi[standard]>=0.136.1",
    "nicegui>=3.12.0",
    "typer>=0.24.1",
]

[dependency-groups]
dev = ["pytest>=9.0.2", "pytest-cov>=7.1.0", "pytest-mock>=3.15.1"]

[project.scripts]
cafma = "cafe_manager.cli.main:run_app"
cafma-web = "cafe_manager.web.main:run_web"

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
